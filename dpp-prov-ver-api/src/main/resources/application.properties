spring.application.name=sync-async-api

#the server port
server.port=${SERVER_PORT:8081}

#logging configurations
logging.file.name=logs/dpp-prov-ver-api.log
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.file-name-pattern=logs/dpp-prov-ver-api.%d{yyyy-MM-dd}.%i.log

#request parameters date formatting
spring.mvc.format.date=yyyy-MM-dd


# Fabric v2.5 local test-network settings. Set FABRIC_TEST_NETWORK to your actual absolute path.
blockchain.msp-id=${MSP_ID:Org1MSP}
blockchain.channel-name=${CHANNEL_NAME:dpp-prov-ver-channel}
blockchain.chaincode-name=${CHAINCODE_NAME:dpp-prov-ver-chaincode}
blockchain.crypto-path=${FABRIC_TEST_NETWORK:/home/radu/scoala/2026-2027/Technologies2026/code/fabric-2.5.16/fabric-samples/test-network}/organizations/peerOrganizations/org1.example.com
blockchain.cert-path=users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem
blockchain.key-dir-path=users/User1@org1.example.com/msp/keystore
blockchain.tls-cert-path=peers/peer0.org1.example.com/tls/ca.crt
blockchain.peer-endpoint=${FABRIC_PEER_ENDPOINT:localhost:7051}
blockchain.override_authority=${FABRIC_OVERRIDE_AUTHORITY:peer0.org1.example.com}

#enble/disable authorization
authorization.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
